[project]
name = "retriever"
version = "0.2.0"
description = ""
readme = "README.md"
authors = [
    { name = "aibakeneko", email = "aibakeneko@gmail.com" }
]
requires-python = ">=3.15.0"
dependencies = [
    "loguru>=0.7.3",
    "pandas>=3.0.6",
    "typer>=0.27.3",
]

[project.scripts]
retriever = "retriever:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[tool.mypy]
python_version = "3.15"
strict = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
