[project]
name = "retriever"
version = "0.2.0"
description = ""
readme = "README.md"
authors = [
    { name = "aibakeneko", email = "aibakeneko@gmail.com" }
]
requires-python = ">=3.15.0"
dependencies = [
    "loguru>=0.7.3",
    "pandas>=3.0.6",
    "typer>=0.27.3",
]

[project.scripts]
retriever = "retriever:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[tool.mypy]
python_version = "3.15"
strict = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py315"
line-length = 140

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "TID", # flake8-tidy-imports
    "C90", # mccabe complexity
    "PL", # pylint
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true